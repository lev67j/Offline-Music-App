name: OfflineMusic
options:
  minimumXcodeGenVersion: 2.42.0
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
targets:
  OfflineMusic:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OfflineMusic/Sources
      - path: OfflineMusic/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.levvlasov.OfflineMusic
        PRODUCT_NAME: Offline Music
        INFOPLIST_FILE: OfflineMusic/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: 1
        MARKETING_VERSION: 1.1
        CURRENT_PROJECT_VERSION: 2
        DEVELOPMENT_TEAM: 227PQ9JKJC
  OfflineMusicTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
      - path: OfflineMusic/Sources/PlaybackOrder.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.levvlasov.OfflineMusicTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  OfflineMusicUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: OfflineMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.levvlasov.OfflineMusicUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: OfflineMusic
        DEVELOPMENT_TEAM: 227PQ9JKJC
schemes:
  OfflineMusic:
    build:
      targets:
        OfflineMusic: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OfflineMusicTests
        - OfflineMusicUITests
